function fmtSize(n) { n = Number(n) || 0; if (n < 1024) return n + ' B'; if (n < 1048576) return Math.round(n / 1024) + ' KB'; return (n / 1048576).toFixed(1).replace('.', ',') + ' MB'; }

/* ---------- API ---------- */
function raw(action, payload) {
  return new Promise(function (resolve) {
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || typeof res !== 'object') res = { ok: false, code: 'GALAT_SERVER', message: 'Respons server tidak valid.' };
        resolve(res);
      })
      .withFailureHandler(function () { resolve({ ok: false, code: 'JARINGAN', message: 'Koneksi bermasalah atau server sibuk. Coba lagi sebentar lagi.' }); })
      .api(action, S.token || null, payload || {});

}
function applyDevice(r) {   // simpan token perangkat baru (hasil rotasi / login "ingat saya")
  if (r && r.device && r.device.token) { if (!devStore.set(r.device.token)) toast('Perangkat ini tidak mendukung "ingat saya".', 'info'); }
  else if (r && r.deviceDenied) toast('"Ingat saya" tidak berlaku untuk akun ini (demi keamanan).', 'info');
}
function resumeOnce() {   // satu permintaan lanjut-sesi pada satu waktu
  if (!S.resuming) {
    S.resuming = raw('auth.resume', { deviceToken: devStore.get() }).then(function (r) {
      S.resuming = null;
      if (r.ok) { S.token = r.token; S.user = r.user; store.set(r.token); applyDevice(r); return true; }
      if (r.code === 'RESUME_GAGAL') devStore.clear();
      return false;
    });
  }
  return S.resuming;
}
function call(action, payload) {
  return raw(action, payload).then(function (res) {
    if (res.ok === false && res.code === 'SESI_BERAKHIR' && S.user) {
      if (action.indexOf('auth.') !== 0 && devStore.get()) {   // perangkat diingat: sambung sesi diam-diam lalu ulangi sekali
        return resumeOnce().then(function (ok) {

          return raw(action, payload).then(function (res2) { if (res2.ok === false && res2.code === 'SESI_BERAKHIR') handleExpired(); return res2; });
        });
      }
      handleExpired();
    }
    return res;
  });
}

/* ---------- kripto: PBKDF2 di browser (kontrak: lihat Auth.gs) ---------- */
function hexToBytes(hex) { var a = new Uint8Array(hex.length / 2); for (var i = 0; i < a.length; i++) a[i] = parseInt(hex.substr(i * 2, 2), 16); return a; }

  if (!(window.crypto && window.crypto.subtle)) return Promise.reject(new Error('NO_CRYPTO'));

  return window.crypto.subtle.importKey('raw', raw, 'PBKDF2', false, ['deriveBits']).then(function (k) {
    return window.crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: hexToBytes(saltHex), iterations: safeIter(iterations) }, k, 256);
  }).then(bytesToHex);
}
