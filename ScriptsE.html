    } }, h('h2', null, 'Tambah kategori'), msg.node, field('Nama kategori', nm), field('Deskripsi (opsional)', ds), add);

        h('div', { class: 'row-actions' }, btn('Ubah', { sm: true, icon: 'edit', onclick: function () { editCategory(c); } }),
          btn(on ? 'Nonaktifkan' : 'Aktifkan', { sm: true, kind: on ? 'danger' : null, onclick: function () {

function adminChecks() {
  var out = h('div'), b1 = btn('Jalankan pemeriksaan integritas', { kind: 'primary', icon: 'refresh' }), b2 = btn('Cari file yatim di Drive', { icon: 'search' });
  b1.addEventListener('click', function () {
    run(b1, function () {
      clear(out); var changes = [], mism = [], checked = 0, total = 0, note = h('p', { class: 'meta', role: 'status' }, 'Memeriksa…'); out.appendChild(note);
      function step(offset) {
        return call('docs.integrityCheck', { offset: offset, limit: 60 }).then(function (r) {
          if (!r.ok) { out.appendChild(h('div', { class: 'msg error', role: 'alert' }, r.message)); return; }
          changes = changes.concat(r.changes); mism = mism.concat(r.sizeMismatch); checked += r.checked; total = r.total; note.textContent = 'Memeriksa… ' + checked + ' dari ' + total;
          if (r.nextOffset !== null && r.checked > 0) return step(r.nextOffset);
          note.textContent = 'Selesai: ' + checked + ' dokumen diperiksa.';
          out.appendChild(h('div', { class: 'card' }, h('h3', null, 'Perubahan status (' + changes.length + ')'), changes.length ? h('ul', null, changes.map(function (c) { return h('li', null, c.title + ': ' + c.change); })) : h('p', { class: 'meta' }, 'Tidak ada perubahan. Semua file sesuai catatan.')));
          if (mism.length) out.appendChild(h('div', { class: 'card' }, h('h3', null, 'Ukuran file berbeda dari catatan (' + mism.length + ')'), h('ul', null, mism.map(function (m) { return h('li', null, m.title + ': tercatat ' + fmtSize(m.recorded) + ', di Drive ' + fmtSize(m.actual)); }))));
        });
      }
      return step(0);
    });
  });
  b2.addEventListener('click', function () {
    run(b2, function () { clear(out); return call('docs.findOrphans').then(function (r) {
      if (!r.ok) { out.appendChild(h('div', { class: 'msg error', role: 'alert' }, r.message)); return; }
      out.appendChild(h('div', { class: 'card' }, h('h3', null, 'File yatim: ' + r.orphans.length + ' (dipindai ' + r.scanned + ' file' + (r.truncated ? ', hasil terpotong' : '') + ')'),
        h('p', { class: 'hint' }, 'Daftar ini hanya laporan. Tidak ada file yang dihapus otomatis; periksa dan tangani sendiri di Google Drive.'),
        r.orphans.length ? h('ul', null, r.orphans.map(function (o) { return h('li', null, o.name + ' (' + fmtSize(o.size) + ') \u2013 ' + o.reason); })) : h('p', { class: 'meta' }, 'Tidak ada file yatim.')));
    }); });
  });
  return h('div', null, h('div', { class: 'card' }, h('h2', null, 'Pemeriksaan data'), h('p', { class: 'meta' }, 'Memastikan setiap dokumen di daftar masih ada di folder Drive arsip, dan memulihkan unggahan yang terputus.'), h('div', { class: 'row-actions' }, b1, b2)), out);
}

  function load() {
    clear(holder); holder.appendChild(spinner());
    return call('audit.list', { page: page, pageSize: 30 }).then(function (r) {
      clear(holder);
      if (!r.ok) { holder.appendChild(errorBox(r, load)); return; }
      holder.appendChild(h('p', { class: 'meta' }, r.total + ' catatan aktivitas (terbaru di atas)'));
      holder.appendChild(h('div', { class: 'scroll-x' }, h('table', { class: 'log' }, h('thead', null, h('tr', null, ['Waktu', 'Pelaku', 'Aksi', 'Sasaran', 'Hasil'].map(function (x) { return h('th', { scope: 'col' }, x); }))),
        h('tbody', null, r.items.map(function (i) { return h('tr', null, h('td', null, fmtDateTime(i.timestamp)), h('td', null, i.actor), h('td', null, ACTION_LABEL[i.action] || i.action), h('td', null, i.target), h('td', null, i.result)); })))));
      if (r.totalPages > 1) holder.appendChild(h('div', { class: 'pager' }, btn('Lebih baru', { sm: true, disabled: page <= 1, onclick: function () { page--; load(); } }), h('span', { class: 'meta' }, 'Halaman ' + r.page + ' dari ' + r.totalPages), btn('Lebih lama', { sm: true, disabled: page >= r.totalPages, onclick: function () { page++; load(); } })));
    });
  }
  load(); return holder;
}

function boot() {

  function tanpaSesi(notice) { S.token = null; store.clear(); S.notice = notice || ''; render(); }

    resumeOnce().then(function (ok) { if (ok) render(); else tanpaSesi(devStore.get() ? '' : 'Sesi perangkat berakhir. Silakan login.'); });
  }
  var t = store.get();
  if (!t) { coba(); return; }
  S.token = t;
  raw('auth.me', {}).then(function (r) {
