      var salt = randomHex(16), key;
      return call('auth.salt', { username: u }).then(function (s) {
        if (!s.ok) throw { resp: s };
        return deriveKey(p, salt, s.iterations);

/* ===================== KERANGKA APLIKASI ===================== */

/* ===================== DASHBOARD & KATEGORI ===================== */

/* ----- gambar mini otomatis (tanpa klik) ----- */
var thumbCache = {}, thumbQueue = [], thumbBusy = 0, THUMB_MAX = 3, THUMB_MIME = { 'image/png': 1, 'image/jpeg': 1 };
function thumbFetch(id) {
  var c = thumbCache[id];
  if (c && (c.u || Date.now() - c.t < 120000)) return Promise.resolve(c.u);   // gagal/belum siap dicoba lagi setelah 2 menit
  return new Promise(function (resolve) { thumbQueue.push({ id: id, resolve: resolve }); thumbPump(); });
}
function thumbPump() {
  while (thumbBusy < THUMB_MAX && thumbQueue.length) {
    var job = thumbQueue.shift(); thumbBusy++;
    (function (j) {
      call('docs.thumb', { documentId: j.id }).then(function (r) {
        var ok = r.ok && r.available && THUMB_MIME[r.mime] && /^[A-Za-z0-9+\/=]+$/.test(r.base64 || '');
        var url = ok ? 'data:' + r.mime + ';base64,' + r.base64 : null;
        thumbCache[j.id] = { u: url, t: Date.now() }; thumbBusy--; j.resolve(url); thumbPump();
      });
    })(job);
  }
}

}, { rootMargin: '200px' }) : null;
function attachThumb(box, id, cls) {   // dimuat saat kartu terlihat di layar; jika gagal, ikon jenis file tetap tampil
  var load = function () {
    thumbFetch(id).then(function (url) {
      if (!url || !box.isConnected) return;
      box.textContent = ''; box.appendChild(h('img', { src: url, alt: cls ? 'Pratinjau halaman pertama' : '' })); box.classList.add('has-thumb');
    });
  };
  if (thumbObs) { box.__load = load; thumbObs.observe(box); } else load();
}

function docCard(d, ctx) {
